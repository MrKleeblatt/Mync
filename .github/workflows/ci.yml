name: Prüfen und bauen

# Jeder Pull Request nach master (Voraussetzung für den Merge, siehe
# docs/updates.md): Jeder Merge wird ein Release, deshalb muss die Version in
# app/pubspec.yaml höher sein als der letzte Tag. Danach Kern und App testen,
# für Linux und Android bauen und die mitgelieferte Nix-Flake prüfen.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version prüfen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Tags für den Vergleich
      - run: python3 tools/release/release_check.py

  linux:
    name: Linux (Kern, Tests, App)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Kern testen und bauen
        working-directory: core
        run: |
          zig build test --summary all
          zig build -Doptimize=ReleaseSafe

      - name: App prüfen und testen
        working-directory: app
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/zig-out/lib
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Linux-App bauen
        working-directory: app
        run: flutter build linux --release

      - uses: actions/cache@v5
        with:
          path: .appimage-tools
          key: appimage-tools-${{ hashFiles('tools/release/make_appimage.sh') }}
      - name: AppImage bauen
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)
          tools/release/make_appimage.sh app/build/linux/x64/release/bundle "$version" appimage
      # zum Ausprobieren vor dem Merge (Actions → dieser Lauf → Artefakte)
      - uses: actions/upload-artifact@v6
        with:
          name: mync-appimage
          path: appimage/mync-x86_64.AppImage
          retention-days: 14

      # Die Flake, die jedem Release beiliegt, gegen diesen Stand prüfen
      - uses: cachix/install-nix-action@v31
      - name: Nix-Flake prüfen
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)
          tools/release/stage_linux.sh app/build/linux/x64/release/bundle "$version" stage
          (cd stage && nix flake check -L path:.)
          # Flake im Repository: das Release dieser Version gibt es noch nicht,
          # deshalb gegen den eben zusammengestellten Stand prüfen
          nix flake check -L --override-input release "path:$PWD/stage"

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          android: "true"
      # Gradle baut den Zig-Kern für alle ABIs mit; signiert wird hier nur
      # mit dem Debug-Schlüssel (der feste Schlüssel ist dem Release vorbehalten)
      - name: APK bauen
        working-directory: app
        run: |
          ../tools/release/retry.sh flutter pub get
          ../tools/release/retry.sh flutter build apk --release --split-per-abi --target-platform android-arm64
