name: Branch aufräumen

# Nach dem Merge eines Pull Requests dessen Branch löschen. Nicht gemergte
# (nur geschlossene) Pull Requests, Branches aus Forks und master bleiben
# unangetastet.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write # zum Löschen der Branch

jobs:
  delete-branch:
    name: Branch löschen
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - name: Branch löschen
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" 2>err.txt; then
            echo "Branch $BRANCH gelöscht."
          elif grep -q "Reference does not exist" err.txt; then
            echo "Branch $BRANCH gibt es schon nicht mehr."
          else
            cat err.txt
            exit 1
          fi
