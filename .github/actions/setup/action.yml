name: Werkzeuge einrichten
description: Zig 0.17.1, Flutter 3.47.9 und die Linux-Bibliotheken für mync

inputs:
  android:
    description: Java 21 für den Android-Build einrichten
    default: "false"

# Caches werden hier nur wiederhergestellt. Gespeichert werden sie allein vom
# Release auf master (Action save-caches): Pull Requests lesen die Einträge
# von master mit, und es entstehen keine Kopien je Pull Request, die den
# 10-GB-Speicher füllen und dabei die von master verdrängen.

runs:
  using: composite
  steps:
    # Linux-Pakete nur für die Linux-App; der Android-Build bringt alles mit
    # (Zig, NDK, CMake aus dem SDK) und spart so gut 40 s.
    # libgtk-3-dev und libmpv-dev ziehen rund 275 Pakete (140 MB) nach sich.
    # Die .deb-Dateien kommen aus dem Cache: Ein langsamer Ubuntu-Spiegel hat
    # den Download schon auf über 12 min gestreckt. Der Schlüssel hängt am
    # Runner-Image (dessen Paketstand) und an der Paketliste; nach einem neuen
    # Image lädt apt nur die geänderten Pakete nach.
    - if: inputs.android != 'true'
      id: apt-key
      shell: bash
      run: |
        packages="libgtk-3-dev libmpv-dev ninja-build clang cmake pkg-config"
        echo "packages=$packages" >> "$GITHUB_OUTPUT"
        echo "prefix=apt-$ImageOS-$(echo "$packages" | sha256sum | cut -c1-16)-" >> "$GITHUB_OUTPUT"
        echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

    - if: inputs.android != 'true'
      id: apt
      uses: actions/cache/restore@v5
      with:
        path: ~/apt-debs
        key: ${{ steps.apt-key.outputs.prefix }}${{ steps.apt-key.outputs.image }}
        restore-keys: ${{ steps.apt-key.outputs.prefix }}

    # Kurze Zeitüberschreitung und mehr Versuche: Hängende Verbindungen zum
    # Spiegel kosteten sonst 30–100 s je Paket.
    - if: inputs.android != 'true'
      name: Linux-Pakete
      shell: bash
      env:
        PACKAGES: ${{ steps.apt-key.outputs.packages }}
      run: |
        mkdir -p ~/apt-debs/partial
        apt=(-o Dir::Cache::Archives="$HOME/apt-debs" -o APT::Keep-Downloaded-Packages=true
             -o Acquire::Retries=5 -o Acquire::http::Timeout=20)
        sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends "${apt[@]}" $PACKAGES
        # veraltete Fassungen (aus einem älteren Image) nicht weiter mitschleppen
        sudo apt-get autoclean "${apt[@]}"
        sudo rm -rf ~/apt-debs/partial ~/apt-debs/lock
        sudo chown -R "$(id -u):$(id -g)" ~/apt-debs
        echo "apt-Cache: $(du -sm ~/apt-debs | cut -f1) MB"

    - name: Zig 0.17.1
      shell: bash
      run: |
        pip install --quiet ziglang==0.17.1
        mkdir -p "$HOME/bin"
        ln -sf "$(python3 -c 'import ziglang,os;print(os.path.dirname(ziglang.__file__))')/zig" "$HOME/bin/zig"
        echo "$HOME/bin" >> "$GITHUB_PATH"

    # Zig-Caches: SQLite (vendor/), compiler_rt/libc je Ziel und der Kern
    # selbst. Der Schlüssel hängt an ganz core/: Ändert ein Commit nur die App,
    # kommt der Kern fertig aus dem Cache. Sonst wird der letzte Stand derselben
    # build.zig/vendor-Generation geholt und nur der Zig-Code neu übersetzt.
    # Getrennt je Job, weil Linux und Android für verschiedene Ziele bauen.
    - id: zig
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/zig
          core/.zig-cache
        key: zig-0.17.1-${{ github.job }}-${{ hashFiles('core/build.zig', 'core/build.zig.zon', 'core/vendor/**') }}-${{ hashFiles('core/**') }}
        restore-keys: zig-0.17.1-${{ github.job }}-${{ hashFiles('core/build.zig', 'core/build.zig.zon', 'core/vendor/**') }}-
    # Der Zig-Cache wächst mit jedem Stand von core/ um dessen Übersetzung.
    # Ist er zu groß, neu anfangen: Dieser Lauf übersetzt SQLite neu (gut
    # 2 min), und das Release speichert danach wieder einen kleinen Stand.
    - if: steps.zig.outputs.cache-matched-key != ''
      name: Zig-Cache klein halten
      shell: bash
      run: |
        size=$(du -scm ~/.cache/zig core/.zig-cache 2>/dev/null | tail -1 | cut -f1)
        echo "Zig-Cache: $size MB"
        if [ "$size" -gt 400 ]; then
          echo "Größer als 400 MB – ohne Cache neu anfangen"
          rm -rf ~/.cache/zig core/.zig-cache
        fi

    # Getrennt für Linux und Android: Flutter lädt die Engine-Dateien der
    # Zielplattform erst beim Bauen nach.
    - id: flutter
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-3.47.9-${{ inputs.android == 'true' && 'android' || 'linux' }}

    - id: pub
      uses: actions/cache/restore@v5
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    # Flutter direkt von Google (wie bei Kassenbon), keine fremde Action
    - name: Flutter 3.47.9
      shell: bash
      run: |
        dir="$RUNNER_TEMP/flutter"
        if [ ! -x "$dir/bin/flutter" ]; then
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
        fi
        git config --global --add safe.directory "$dir"
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/flutter" --version

    - if: inputs.android == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - if: inputs.android == 'true'
      name: Gradle robuster gegen Download-Störungen
      shell: bash
      run: |
        mkdir -p ~/.gradle/init.d
        cp "$GITHUB_WORKSPACE/.github/gradle/mirror.init.gradle" ~/.gradle/init.d/
        # Bricht ein Download ab, sperrt Gradle die Quelle für den Rest des
        # Builds („Could not find“ für alles Weitere). Mehr Versuche mit
        # wachsender Pause verhindern das bei kurzen Aussetzern.
        cat >> ~/.gradle/gradle.properties <<'PROPS'
        systemProp.org.gradle.internal.repository.max.tentatives=8
        systemProp.org.gradle.internal.repository.initial.backoff=1000
        systemProp.org.gradle.internal.http.connectionTimeout=60000
        systemProp.org.gradle.internal.http.socketTimeout=60000
        PROPS

    # Gradle-Abhängigkeiten zwischenspeichern: schneller und unabhängiger von
    # kurzen Störungen der Maven-/Plugin-Server
    - if: inputs.android == 'true'
      id: gradle
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
        restore-keys: gradle-${{ runner.os }}-

    # Das NDK (flutter.ndkVersion) fehlt im Runner-Image; ohne Cache lädt und
    # entpackt Gradle es bei jedem Lauf (~25 s). Mit einem neuen Flutter, das
    # ein anderes NDK will, die Version hier und in save-caches nachziehen.
    - if: inputs.android == 'true'
      id: ndk
      uses: actions/cache/restore@v5
      with:
        path: /usr/local/lib/android/sdk/ndk/28.2.13676358
        key: ndk-28.2.13676358

    # Für save-caches: die Schlüssel der Caches, die es noch nicht gibt
    # (leer = Treffer, nichts zu speichern)
    - name: Fehlende Caches merken
      shell: bash
      env:
        APT: ${{ steps.apt.outputs.cache-hit != 'true' && steps.apt.outputs.cache-primary-key || '' }}
        ZIG: ${{ steps.zig.outputs.cache-hit != 'true' && steps.zig.outputs.cache-primary-key || '' }}
        FLUTTER: ${{ steps.flutter.outputs.cache-hit != 'true' && steps.flutter.outputs.cache-primary-key || '' }}
        PUB: ${{ steps.pub.outputs.cache-hit != 'true' && steps.pub.outputs.cache-primary-key || '' }}
        GRADLE: ${{ steps.gradle.outputs.cache-hit != 'true' && steps.gradle.outputs.cache-primary-key || '' }}
        NDK: ${{ steps.ndk.outputs.cache-hit != 'true' && steps.ndk.outputs.cache-primary-key || '' }}
      run: |
        {
          echo "MYNC_CACHE_APT=$APT"
          echo "MYNC_CACHE_ZIG=$ZIG"
          echo "MYNC_CACHE_FLUTTER=$FLUTTER"
          echo "MYNC_CACHE_PUB=$PUB"
          echo "MYNC_CACHE_GRADLE=$GRADLE"
          echo "MYNC_CACHE_NDK=$NDK"
        } >> "$GITHUB_ENV"
