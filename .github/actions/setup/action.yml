name: Werkzeuge einrichten
description: Zig 0.17.1, Flutter 3.47.9 und die Linux-Bibliotheken für mync

inputs:
  android:
    description: Java 21 für den Android-Build einrichten
    default: "false"

runs:
  using: composite
  steps:
    - name: Linux-Pakete
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev libmpv-dev ninja-build clang cmake pkg-config

    - name: Zig 0.17.1
      shell: bash
      run: |
        pip install --quiet ziglang==0.17.1
        mkdir -p "$HOME/bin"
        ln -sf "$(python3 -c 'import ziglang,os;print(os.path.dirname(ziglang.__file__))')/zig" "$HOME/bin/zig"
        echo "$HOME/bin" >> "$GITHUB_PATH"

    # Zig-Caches: vor allem SQLite (vendor/) und compiler_rt/libc je Ziel, die
    # sich selten ändern. Der Schlüssel hängt deshalb nicht an src/ – sonst
    # entstünde bei jedem Commit ein neuer, immer größerer Eintrag. Getrennt
    # je Job, weil Linux und Android für verschiedene Ziele bauen.
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cache/zig
          core/.zig-cache
        key: zig-0.17.1-${{ github.job }}-${{ hashFiles('core/build.zig', 'core/build.zig.zon', 'core/vendor/**') }}
        restore-keys: zig-0.17.1-${{ github.job }}-

    # Getrennt für Linux und Android: Flutter lädt die Engine-Dateien der
    # Zielplattform erst beim Bauen nach, und gespeichert wird nur, wenn der
    # Schlüssel fehlte – mit einem gemeinsamen Schlüssel fehlten dem Android-
    # Job seine Dateien jedes Mal.
    - uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-3.47.9-${{ inputs.android == 'true' && 'android' || 'linux' }}

    - uses: actions/cache@v5
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    # Flutter direkt von Google (wie bei Kassenbon), keine fremde Action
    - name: Flutter 3.47.9
      shell: bash
      run: |
        dir="$RUNNER_TEMP/flutter"
        if [ ! -x "$dir/bin/flutter" ]; then
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
        fi
        git config --global --add safe.directory "$dir"
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/flutter" --version

    - if: inputs.android == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - if: inputs.android == 'true'
      name: Gradle robuster gegen Download-Störungen
      shell: bash
      run: |
        mkdir -p ~/.gradle/init.d
        cp "$GITHUB_WORKSPACE/.github/gradle/mirror.init.gradle" ~/.gradle/init.d/
        # Bricht ein Download ab, sperrt Gradle die Quelle für den Rest des
        # Builds („Could not find“ für alles Weitere). Mehr Versuche mit
        # wachsender Pause verhindern das bei kurzen Aussetzern.
        cat >> ~/.gradle/gradle.properties <<'PROPS'
        systemProp.org.gradle.internal.repository.max.tentatives=8
        systemProp.org.gradle.internal.repository.initial.backoff=1000
        systemProp.org.gradle.internal.http.connectionTimeout=60000
        systemProp.org.gradle.internal.http.socketTimeout=60000
        PROPS

    # Gradle-Abhängigkeiten zwischenspeichern: schneller und unabhängiger von
    # kurzen Störungen der Maven-/Plugin-Server
    - if: inputs.android == 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
        restore-keys: gradle-${{ runner.os }}-
